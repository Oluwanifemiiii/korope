<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splash</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./korope-tokens.css">
<link rel="stylesheet" href="./korope-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="k screen" data-theme="{{theme}}" style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-32); background-color: var(--bg-canvas); background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px), linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px); background-size: 32px 32px">
  <div style="display: flex; align-items: center; gap: var(--space-12)">
    <svg role="img" aria-label="Korope" viewBox="0 0 48 48" style="width: 56px; height: 56px"><circle cx="13" cy="32" r="6" fill="none" style="stroke: var(--action-primary)" stroke-width="4"></circle><path d="M19 32h3a6 6 0 0 0 6-6v-4a6 6 0 0 1 6-6" fill="none" style="stroke: var(--action-primary)" stroke-width="4" stroke-linecap="round"></path><circle cx="35" cy="16" r="7" style="fill: var(--secondary-400)"></circle></svg>
    <span style="font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -0.035em">korope</span>
  </div>
  <div style="position: relative; width: 240px; height: 44px">
    <svg aria-hidden="true" viewBox="0 0 240 44" style="position: absolute; inset: 0; width: 240px; height: 44px">
      <path d="M12 34H100a12 12 0 0 0 12-12a12 12 0 0 1 12-12H228" fill="none" style="stroke: var(--border-default)" stroke-width="4" stroke-linecap="round"></path>
      <path d="M12 34H100a12 12 0 0 0 12-12a12 12 0 0 1 12-12H228" fill="none" style="stroke: var(--route-line); stroke-dasharray: 300; animation: k-draw 1.2s var(--ease-standard) both" stroke-width="4" stroke-linecap="round"></path>
      <circle cx="12" cy="34" r="5" style="fill: var(--bg-surface); stroke: var(--action-primary)" stroke-width="3"></circle>
      <circle cx="228" cy="10" r="6" style="fill: var(--secondary-400)"></circle>
    </svg>
    <span class="mk-bus" style="position: absolute; left: 0; top: 0; width: 28px; height: 28px; offset-path: path('M12 34H100a12 12 0 0 0 12-12a12 12 0 0 1 12-12H228'); offset-rotate: 0deg; animation: k-travel 1.4s var(--ease-standard) 0.2s both"><span class="ic ic-16 ic-bus" aria-hidden="true"></span></span>
  </div>
  <p class="t-caption t-secondary" style="position: absolute; bottom: var(--space-48)">Lekki · Victoria Island · Lagos Island</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"device":{"editor":"enum","options":["390x844","360x740"],"default":"390x844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const small = (this.props.device ?? '390x844') === '360x740';
    return { theme: this.props.theme ?? 'light', w: small ? 360 : 390, h: small ? 740 : 844 };
  }
}
</script>
</body>
</html>
