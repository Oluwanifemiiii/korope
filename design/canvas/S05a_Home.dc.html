<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./korope-tokens.css">
<link rel="stylesheet" href="./korope-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="k screen" data-theme="{{theme}}" style="width: {{w}}px; height: {{h}}px">
  <div class="map" style="top: {{mapTop}}px">
    <img src="{{mapSrc}}" alt="Map of Lekki around Chevron with nearby Korope stops and buses">
    <span class="mk mk-stop" style="left: 668px; top: 1040px"></span>
    <span class="mk mk-stop" style="left: 628px; top: 900px"></span>
    <span class="mk mk-stop" style="left: 726px; top: 1245px"></span>
    <span class="mk" style="left: 700px; top: 1150px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-surface); box-shadow: inset 0 0 0 4px var(--action-primary)"></span>
    <span class="mk-label" style="left: 702px; top: 1124px">Chevron Roundabout</span>
    <span class="mk mk-me" style="left: 724px; top: 1176px"></span>
    <span class="mk" style="left: 684px; top: 1095px"><span class="mk-bus breathe"><span class="ic ic-16 ic-bus" aria-hidden="true"></span></span></span>
    <span class="mk" style="left: 646px; top: 968px"><span class="mk-bus"><span class="ic ic-16 ic-bus" aria-hidden="true"></span></span></span>
    <span class="mk" style="left: 738px; top: 1290px"><span class="mk-bus"><span class="ic ic-16 ic-bus" aria-hidden="true"></span></span></span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: var(--space-16) var(--space-16) 0; display: flex; flex-direction: column; gap: var(--space-12)">
    <div style="display: flex; align-items: center; gap: var(--space-12)">
      <div class="glass e1" style="flex: 1 1 auto; min-width: 0; border-radius: var(--radius-l); padding: var(--space-8) var(--space-16)">
        <p class="t-subtitle t-semibold">Good morning, Adaeze</p>
        <p class="t-caption t-secondary" style="display: flex; align-items: center; gap: var(--space-8)">Ready for work?<span style="display: inline-flex; align-items: center; gap: var(--space-4)"><span class="ic ic-16 ic-sun" aria-hidden="true" style="color: var(--secondary-600)"></span><span class="num">29°</span></span></p>
      </div>
      <button type="button" class="btn btn-icon glass" aria-label="Notifications, 1 new" style="position: relative; width: 56px; height: 56px; border-radius: var(--radius-l)"><span class="ic ic-bell" aria-hidden="true"></span><span style="position: absolute; top: 14px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--error-500); box-shadow: 0 0 0 2px var(--bg-surface)"></span></button>
    </div>
    <a href="S06_Search.dc.html" class="search glass" style="text-decoration: none">
      <span class="ic ic-search" aria-hidden="true" style="color: var(--text-brand)"></span>
      <span class="search-placeholder">Where are you going today?</span>
      <span class="btn btn-icon" aria-hidden="true" style="box-shadow: none; background: transparent; color: var(--text-secondary)"><span class="ic ic-20 ic-mic"></span></span>
    </a>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: flex-end; padding: 0 var(--space-16) var(--space-12)">
      <button type="button" class="btn btn-icon glass" aria-label="Centre on my location"><span class="ic ic-locate" aria-hidden="true" style="color: var(--accent-600)"></span></button>
    </div>
    <div class="sheet" style="border-radius: var(--radius-xl) var(--radius-xl) 0 0">
      <div class="sheet-head" style="padding-bottom: var(--space-4)"><span class="sheet-handle" aria-hidden="true"></span></div>
      <div style="padding: 0 var(--space-16) var(--space-16); display: flex; flex-direction: column; gap: var(--space-16)">
        <a href="S07_Departures.dc.html" class="card-flat" style="padding: var(--space-12) var(--space-16); display: flex; align-items: center; gap: var(--space-12); color: var(--text-primary)">
          <span class="icon-tile brand"><span class="ic ic-20 ic-pin" aria-hidden="true"></span></span>
          <div class="grow">
            <p class="t-label t-secondary">Nearest stop · 3 min walk</p>
            <p class="t-body t-semibold">Chevron Roundabout</p>
            <p class="t-caption t-secondary num">Next: 7:15 to CMS · from ₦1,500</p>
          </div>
          <span class="ic ic-20 ic-chev-r t-secondary" aria-hidden="true"></span>
        </a>
        <div style="display: flex; gap: var(--space-12); overflow: hidden">
          <a href="S07_Departures.dc.html" class="card-flat" style="flex: none; width: 148px; padding: var(--space-12); display: flex; flex-direction: column; gap: var(--space-8); color: var(--text-primary)"><span class="icon-tile accent" style="width: 36px; height: 36px"><span class="ic ic-20 ic-briefcase" aria-hidden="true"></span></span><div><p class="t-caption t-semibold">Work</p><p class="t-label t-secondary num">Marina · 48 min</p></div></a>
          <a href="#" class="card-flat" style="flex: none; width: 148px; padding: var(--space-12); display: flex; flex-direction: column; gap: var(--space-8); color: var(--text-primary)"><span class="icon-tile highlight" style="width: 36px; height: 36px"><span class="ic ic-20 ic-heart" aria-hidden="true"></span></span><div><p class="t-caption t-semibold">Mum's place</p><p class="t-label t-secondary num">Ajah · 22 min</p></div></a>
          <a href="#" class="card-flat" style="flex: none; width: 148px; padding: var(--space-12); display: flex; flex-direction: column; gap: var(--space-8); color: var(--text-primary)"><span class="icon-tile" style="width: 36px; height: 36px"><span class="ic ic-20 ic-bag" aria-hidden="true"></span></span><div><p class="t-caption t-semibold">Circle Mall</p><p class="t-label t-secondary num">Jakande · 9 min</p></div></a>
        </div>
      </div>
      <nav class="nav glass" aria-label="Main">
        <a class="nav-item is-active" href="S05a_Home.dc.html" aria-current="page"><span class="nav-pill"><span class="ic ic-home" aria-hidden="true"></span></span>Home</a>
        <a class="nav-item" href="S16a_Trips.dc.html"><span class="nav-pill"><span class="ic ic-ticket" aria-hidden="true"></span></span>Trips</a>
        <a class="nav-item" href="S20_KoropePlus.dc.html"><span class="nav-pill"><span class="ic ic-building" aria-hidden="true"></span></span>Korope+</a>
        <a class="nav-item" href="S17a_Wallet.dc.html"><span class="nav-pill"><span class="ic ic-wallet" aria-hidden="true"></span></span>Wallet</a>
        <a class="nav-item" href="S19_Profile.dc.html"><span class="nav-pill"><span class="ic ic-user" aria-hidden="true"></span></span>Profile</a>
      </nav>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"device":{"editor":"enum","options":["390x844","360x740"],"default":"390x844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const small = (this.props.device ?? '390x844') === '360x740';
    const theme = this.props.theme ?? 'light';
    return { theme, w: small ? 360 : 390, h: small ? 740 : 844, mapTop: small ? -880 : -820, mapSrc: theme === 'dark' ? './map-night.svg' : './map-light.svg' };
  }
}
</script>
</body>
</html>
