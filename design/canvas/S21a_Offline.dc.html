<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No connection</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./korope-tokens.css">
<link rel="stylesheet" href="./korope-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="k screen" data-theme="{{theme}}" style="width: {{w}}px; height: {{h}}px">
  <div class="map" style="top: -570px; transform: scale(0.8); transform-origin: 605px 830px; filter: grayscale(1); opacity: 0.6"><img src="{{mapSrc}}" alt=""></div>
  <span class="mk" style="left: calc(50% + 10px); top: 260px"><span class="mk-bus is-dim"><span class="ic ic-16 ic-bus" aria-hidden="true"></span></span></span>
  <span class="mk-label" style="left: calc(50% + 16px); top: 230px; color: var(--text-secondary)">Last seen 7:42</span>

  <div style="position: absolute; left: var(--space-16); right: var(--space-16); top: var(--space-16)">
    <div role="status" class="banner" style="background: var(--neutral-900); color: #F1F4F2; box-shadow: var(--elevation-3); align-items: center">
      <span class="ic ic-20 ic-wifi-off" aria-hidden="true"></span>
      <span class="grow"><strong>You're offline.</strong> Bus position paused at 7:42. We'll update it when you're back.</span>
      <button type="button" class="btn btn-tertiary btn-m" style="color: var(--secondary-300); padding: 0 var(--space-8); height: 40px">Retry</button>
    </div>
  </div>

  <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0">
    <div class="sheet-head" style="padding-bottom: var(--space-4)"><span class="sheet-handle" aria-hidden="true"></span></div>
    <div style="padding: 0 var(--space-20) var(--space-20); display: flex; flex-direction: column; gap: var(--space-16)">
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div><p class="t-caption t-secondary">To CMS · planned arrival <span class="num">7:57</span></p><p class="t-h2 num" style="color: var(--text-secondary)">About 23 min</p></div>
        <span class="badge badge-neutral" style="margin-bottom: var(--space-8)">Estimate</span>
      </div>
      <div class="banner banner-success"><span class="ic ic-20 ic-offline-ok" aria-hidden="true" style="color: var(--success-icon)"></span><span>Your boarding pass and trip details are saved on this phone and work without data.</span></div>
      <a class="btn btn-primary btn-block" href="S13_Pass.dc.html"><span class="ic ic-20 ic-qr" aria-hidden="true"></span>Show boarding pass</a>
      <button type="button" class="btn btn-secondary btn-block" style="color: var(--error-text); box-shadow: inset 0 0 0 1.5px var(--error-border)"><span class="ic ic-20 ic-phone" aria-hidden="true"></span>Call Korope safety line</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"device":{"editor":"enum","options":["390x844","360x740"],"default":"390x844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const small = (this.props.device ?? '390x844') === '360x740';
    const theme = this.props.theme ?? 'light';
    return { theme, w: small ? 360 : 390, h: small ? 740 : 844, mapSrc: theme === 'dark' ? './map-night.svg' : './map-light.svg' };
  }
}
</script>
</body>
</html>
